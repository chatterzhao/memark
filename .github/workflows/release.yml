name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # required for PyPI trusted publisher

jobs:
  # ── Build macOS binary ───────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build standalone binary
        run: |
          pyinstaller --onefile \
            --name memark-macos-arm64 \
            --add-data "memark/skill_bundle:memark/skill_bundle" \
            memark/cli.py

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: memark-macos-arm64
          path: dist/memark-macos-arm64

  # ── Create GitHub Release ────────────────────────────────────────────
  github-release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: memark-macos-arm64
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/memark-macos-arm64
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

  # ── Publish to PyPI ──────────────────────────────────────────────────
  pypi-publish:
    needs: build-macos
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/memark/
    permissions:
      id-token: write  # trusted publisher
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
