name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check memark/ tests/

  # ── Test (macOS only — service scheduler is launchd/macOS-only) ───────
  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  # ── Build macOS binary ───────────────────────────────────────────────
  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build standalone binary
        run: |
          pyinstaller --onefile \
            --name memark-macos-arm64 \
            --add-data "memark/skill_bundle:memark/skill_bundle" \
            memark/cli.py

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: memark-macos-arm64
          path: dist/memark-macos-arm64
          retention-days: 30
