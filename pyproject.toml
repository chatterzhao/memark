[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memark"
version = "0.1.2"
description = "CLI-first bridge that promotes MemPalace room packages into Graphify-ready corpus files."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MemArk contributors" }]
license = { text = "MIT" }
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
memark = "memark.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["memark*"]

[tool.setuptools.package-data]
memark = ["skill_bundle/*.md", "skill_bundle/bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
